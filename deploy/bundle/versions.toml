# ---------------------------------------------------------------- Yggdrasil
# Built from source (no bare binaries are published), unmodified, static.
# v0.5.15 is a lightweight tag: `git ls-remote ... refs/tags/v0.5.15` prints the
# commit itself (checked 2026-11-11; also the latest GitHub release).
# `go` is the minimum from go.mod; the build uses whatever Go toolchain is
# installed and fails if it is older.
[yggdrasil]
