sha256 = "15464d99adc3bb4de1308260d79878336b04a1ac1aeff83e10f192de7d235946"
files = "tor libevent-2.1.7.dylib pluggable_transports/lyrebird"
licenses = "tor:docs/tor.txt lyrebird:docs/lyrebird.txt libevent:docs/libevent.txt openssl:docs/openssl.txt"

[tor.macos-aarch64]
