[package]
name = "socketguard-daemon"
version.workspace = true
edition.workspace = true

[dependencies]
socketguard-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
uuid = { workspace = true }
chrono = { workspace = true }
axum = "0.8"
tower-http = { version = "0.6", features = ["cors"] }
sqlx = { version = "0.8", features = ["runtime-tokio", "sqlite"] }
rand = "0.8"
socket2 = "0.6"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures-util = "0.3"
# OpenTelemetry: these crates are version-locked to each other (0.33 / tracing-opentelemetry 0.34).
# OTLP over HTTP/protobuf (reqwest-blocking, on the SDK export threads) avoids the
# tonic/protoc toolchain, which is the harder build on Windows.
opentelemetry = "0.33"
opentelemetry_sdk = { version = "0.33", features = ["logs", "metrics"] }
opentelemetry-otlp = { version = "0.33", default-features = false, features = ["http-proto", "reqwest-blocking-client", "trace", "logs", "metrics"] }
opentelemetry-appender-tracing = "0.33"
tracing-opentelemetry = "0.34"

[dev-dependencies]
insta = { workspace = true }
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
opentelemetry_sdk = { version = "0.33", features = ["testing"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_NetworkManagement_IpHelper",
    "Win32_NetworkManagement_Ndis",
    "Win32_Networking_WinSock",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
] }
