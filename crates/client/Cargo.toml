[package]
name = "socketguard-client"
version.workspace = true
edition.workspace = true

[dependencies]
socketguard-core = { workspace = true }
tokio = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
chrono = { workspace = true }
thiserror = { workspace = true }
http = "1"
http-body-util = "0.1"
hyper = { version = "1", features = ["client", "http1"] }
hyper-util = { version = "0.1", features = ["tokio"] }
bytes = "1"
futures-util = "0.3"
percent-encoding = "2"
serde_urlencoded = "0.7"

[target.'cfg(windows)'.dependencies]
# Reading the owner of the pipe, to tell the SocketGuard service from a squatter.
windows = { version = "0.62", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }
