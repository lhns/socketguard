# Release (ADR 0050): on a tag v<version>, build and test every package (packages.yml), then put
# the MSI, portable zip, deb, rpm, pkg and SHA256SUMS on a DRAFT GitHub release. workflow_dispatch is a dry
# run: same builds, the files and SHA256SUMS are uploaded as a workflow artifact and no release
# is made. Packages are unsigned; docs/packaging.md lists the secrets and where signing goes.
name: release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: The tag equals the workspace version
        run: |
          ws=$(bash deploy/ci/version.sh)
          echo "workspace version: $ws"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            [ "${GITHUB_REF_NAME#v}" = "$ws" ] || { echo "tag $GITHUB_REF_NAME does not match version $ws" >&2; exit 1; }
          else
            echo "not a tag (dry run): nothing to compare"
          fi
          bash deploy/ci/check-version.sh

  packages:
    needs: version
    uses: ./.github/workflows/packages.yml
    # SIGNING: secrets reach the called workflow only with `secrets: inherit` (docs/packaging.md
    # names APPLE_* and WINDOWS_* secrets). Unsigned today, so nothing is passed.

  release:
    needs: packages
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: '{msi,portable-zip,linux-packages,macos-pkg-*}'
          path: release
          merge-multiple: true
      - name: SHA256SUMS
        working-directory: release
        run: |
          ls -l
          sha256sum SocketGuard-*.msi SocketGuard-portable-*.zip socketguard_*.deb socketguard-*.rpm SocketGuard-*.pkg | tee SHA256SUMS
      # SIGNING (not done): sign SHA256SUMS or the files here, e.g. with cosign:
      #   - run: cosign sign-blob --yes release/SHA256SUMS --output-signature release/SHA256SUMS.sig
      # The versions the packages ship are the pins in deploy/bundle/versions.toml at this commit
      # (the same file each package job fetched from); ADR 0052 asks the notes to name them.
      - name: Release notes
        run: |
          pin() { # pin <section> <key>
            awk -F'"' -v sec="[$1]" -v key="$2" '/^\[/ { s = ($0 == sec) } s && $1 ~ ("^[ \t]*" key "[ \t]*=[ \t]*$") { print $2; exit }' deploy/bundle/versions.toml
          }
          tor=$(pin tor version); ygg_tag=$(pin yggdrasil tag); ygg_commit=$(pin yggdrasil commit); wintun=$(pin wintun version)
          for v in "$tor" "$ygg_tag" "$ygg_commit" "$wintun"; do [ -n "$v" ] || { echo "versions.toml: a pin is missing" >&2; exit 1; }; done
          ref="${GITHUB_REF_NAME}"
          [ "$GITHUB_REF_TYPE" = tag ] || ref="${GITHUB_SHA}"
          {
            echo "Unsigned packages: see the Install section of the README for what each system shows. Verify with SHA256SUMS."
            echo
            echo "### Bundled third-party software"
            echo
            echo "The packages ship these programs unmodified and run them as separate processes (ADR 0052):"
            echo
            echo "- **Tor $tor** (Tor Expert Bundle, checksum and signature verified): https://dist.torproject.org/torbrowser/$tor/. Source: https://gitlab.torproject.org/tpo/core/tor"
            echo "- **Yggdrasil $ygg_tag**, built from the pinned source commit \`$ygg_commit\`: https://github.com/yggdrasil-network/yggdrasil-go/tree/$ygg_commit (LGPL-3.0 with a combined-work exception)"
            echo "- **Wintun $wintun** (Windows only): https://www.wintun.net"
            echo
            echo "Licences, notices and exact sources: [THIRD_PARTY_NOTICES.md](https://github.com/$GITHUB_REPOSITORY/blob/$ref/THIRD_PARTY_NOTICES.md). The licence texts are installed with the packages (\`third_party/licenses\`, and \`licenses\` or \`/usr/share/doc/socketguard\`)."
          } > "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md"
          cat "$RUNNER_TEMP/release-notes.md" >> "$GITHUB_STEP_SUMMARY"
      - name: Draft release (tag) or workflow artifact (dry run)
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" release/* --draft --title "SocketGuard ${GITHUB_REF_NAME#v}" \
            --notes-file "$RUNNER_TEMP/release-notes.md"
      - uses: actions/upload-artifact@v4
        if: github.ref_type != 'tag'
        with:
          name: release-dry-run
          path: release/*
          if-no-files-found: error
