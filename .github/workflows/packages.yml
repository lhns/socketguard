# Installers (ADR 0050, 0057): the Windows MSI and portable zip, the Linux deb and rpm, the macOS pkg.
# Each system builds ONCE with `./build.sh --stage` (the programs plus the pinned Tor, Yggdrasil and
# Wintun, ADR 0052; docs/packaging.md) and wraps that tree in its packages, and a second set with
# the next patch version, by repackaging, for the upgrade test. Then the packages are installed on
# the runner, run Tor and Yggdrasil from the installed files and are checked from outside
# (deploy/ci/footprint-check.*). Between jobs only finished packages travel, never the staged tree.
# Reused by release.yml. Unsigned.
name: packages

on:
  push:
    branches: [main]
  workflow_dispatch:
  workflow_call:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0

permissions:
  contents: read

jobs:
  # One build for both Windows packages.
  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - uses: ./.github/actions/setup-wix
      - uses: ./.github/actions/bundle
      - name: Build and stage (./build.sh --stage)
        shell: bash
        run: bash ./build.sh --stage --require-signature
      # SIGN (not done, docs/packaging.md): import WINDOWS_SIGNING_CERT_PFX and sign the three
      # dist\stage\*.exe here with `signtool sign /fd sha256 /tr <timestamp url> /td sha256`,
      # then sign the MSIs after the next step the same way.
      - name: Build the packages (the MSI, the MSI of the next patch version for the upgrade test, the portable zip)
        shell: bash
        run: |
          v=$(bash deploy/ci/version.sh)
          next=$(bash deploy/ci/version.sh --next)
          echo "version $v, next $next"
          pwsh -File installer/windows/build.ps1 -Version "$v" -Stage dist/stage -Out "dist/SocketGuard-$v-x64.msi"
          pwsh -File installer/windows/build.ps1 -Version "$next" -Stage dist/stage -Out "dist/next/SocketGuard-$next-x64.msi"
          pwsh -File installer/windows/portable.ps1 -Stage dist/stage -Out dist/SocketGuard-portable-windows-x64.zip
      - uses: actions/upload-artifact@v4
        with:
          name: msi
          path: dist/SocketGuard-*-x64.msi
          if-no-files-found: error
      # Not part of the release: release.yml downloads `msi` by name.
      - uses: actions/upload-artifact@v4
        with:
          name: msi-next
          path: dist/next/SocketGuard-*-x64.msi
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: portable-zip
          path: dist/SocketGuard-portable-windows-x64.zip
          if-no-files-found: error

  msi:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: msi
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: msi-next
          path: dist/next
      - name: Self-test of the footprint check
        shell: pwsh
        run: ./deploy/ci/footprint-check.ps1 -SelfTest
      - name: Install, exercise, upgrade, remove, purge
        shell: pwsh
        timeout-minutes: 45
        run: |
          $msi = (Get-ChildItem dist/SocketGuard-*-x64.msi).FullName
          $next = (Get-ChildItem dist/next/SocketGuard-*-x64.msi).FullName
          ./test/msi.ps1 -Msi $msi -MsiNext $next -Out dist/msi-test -StrictFirewall
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: msi-test-output
          path: dist/msi-test
          if-no-files-found: ignore

  # Portable mode on a clean runner (ADR 0054): real firewall, clean exit, kill, coexistence with
  # the service, and the bundled Tor and Yggdrasil (ADR 0052) from the zip's third_party\. Elevated,
  # machine-wide changes, no prompts; the runner is thrown away.
  portable:
    needs: windows
    runs-on: windows-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: portable-zip
          path: dist
      - name: Start, exercise, end, kill, coexist, Tor and Yggdrasil
        shell: pwsh
        timeout-minutes: 45
        run: ./test/portable.ps1 -Zip dist/SocketGuard-portable-windows-x64.zip -Out dist/portable-test
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: portable-test-output
          path: dist/portable-test
          if-no-files-found: ignore

  linux:
    # 22.04: the oldest glibc and webkit2gtk-4.1 the packages should run on.
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "true"
          desktop-deps: "true"
      - uses: ./.github/actions/setup-nfpm
      - uses: ./.github/actions/bundle
      - name: Build and stage (./build.sh --stage)
        run: bash ./build.sh --stage --require-signature
      - name: Build the packages (this version, and the next patch for the upgrade test)
        run: |
          v=$(bash deploy/ci/version.sh)
          next=$(bash deploy/ci/version.sh --next)
          bash installer/linux/build.sh "$v" dist/stage dist
          bash installer/linux/build.sh "$next" dist/stage dist/next
      - name: Self-test of the footprint check
        run: bash deploy/ci/footprint-check.sh --self-test
      - name: deb - install, upgrade, remove, purge (a VM with systemd)
        run: bash test/deb.sh dist/socketguard_*_amd64.deb dist/next/socketguard_*_amd64.deb
      - name: rpm - install and erase in a Fedora container (no systemd there)
        run: bash test/rpm.sh dist/socketguard-*.x86_64.rpm
      - uses: actions/upload-artifact@v4
        with:
          name: linux-packages
          path: |
            dist/*.deb
            dist/*.rpm
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: linux-rpm-next
          path: dist/next/*.rpm
          if-no-files-found: error

  macos:
    # macos-latest is arm64; macos-15-intel is x86_64 (docs.github.com/en/actions/reference/runners/github-hosted-runners)
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          node: "true"
      - uses: ./.github/actions/bundle
      # The stage and the pkg are for the runner's architecture (uname -m; macos-latest is Apple silicon).
      - name: Build and stage (./build.sh --stage)
        run: bash ./build.sh --stage --require-signature
      - name: Build the pkgs (this version, and the next patch for the upgrade test)
        run: |
          v=$(bash deploy/ci/version.sh)
          next=$(bash deploy/ci/version.sh --next)
          bash installer/macos/build.sh "$v" dist/stage dist
          bash installer/macos/build.sh "$next" dist/stage dist/next
      - name: Self-test of the footprint check
        run: bash deploy/ci/footprint-check.sh --self-test
      - name: Install, upgrade, purge
        run: bash test/pkg.sh dist/SocketGuard-*.pkg dist/next/SocketGuard-*.pkg
      - uses: actions/upload-artifact@v4
        with:
          name: macos-pkg-${{ matrix.os }}
          path: dist/SocketGuard-*.pkg
          if-no-files-found: error

  # The rpm's whole life cycle on a real systemd: a Fedora container with systemd as PID 1,
  # privileged, on the Ubuntu VM (the container uses the host kernel's nftables).
  rpm-systemd:
    needs: linux
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: linux-packages
          path: dist
      - uses: actions/download-artifact@v4
        with:
          name: linux-rpm-next
          path: dist/next
      - run: bash test/rpm-systemd.sh dist/socketguard-*.x86_64.rpm dist/next/socketguard-*.x86_64.rpm
