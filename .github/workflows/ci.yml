# CI on GitHub Actions. Forgejo has its own copy in .forgejo/workflows/ci.yml (Forgejo
# ignores .github/ when .forgejo/ exists). The Tauri crate (socketguard-ui) is excluded
# from the Rust jobs: it needs webkit2gtk and builds the frontend; the `ui` job covers the
# frontend. Docker end-to-end tests (deploy/e2e) run in e2e.yml (GitHub, nightly).
name: ci

on:
  push:
    branches: ['**']
  pull_request:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --exclude socketguard-ui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude socketguard-ui

  ui:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ui
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          rust: "false"
          node: "true"
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  # The Tauri crate's own tests (e.g. sibling_candidates), on all three systems. Its build
  # script builds the frontend when ui/dist is missing, so node and `npm ci` come first.
  tauri:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          components: clippy
          node: "true"
          desktop-deps: "true"
      - run: cargo clippy -p socketguard-ui --all-targets -- -D warnings
      - run: cargo test -p socketguard-ui

  # The Windows code (WFP, the service, ACLs, the child spawner) has no other
  # cfg(windows) coverage than this job and the MSI test in packages.yml.
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          components: clippy
      - run: cargo clippy --workspace --exclude socketguard-ui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude socketguard-ui --no-fail-fast

  # Real nftables in network namespaces. The runner is a VM with passwordless sudo.
  # cargo runs as the runner user (rustup is per-user); only the test binary runs as root.
  netns:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - name: Install tools
        run: |
          # The runner's package mirror sometimes fails to resolve; retry before giving up.
          for i in 1 2 3 4 5; do
            sudo apt-get update -qq &&
              sudo apt-get install -y -qq nftables iproute2 conntrack iputils-ping netcat-openbsd python3 jq &&
              break
            [ "$i" = 5 ] && exit 1
            # The runner image's Azure mirror is the one that fails; fall back to the main archive.
            echo "http://archive.ubuntu.com/ubuntu/" | sudo tee /etc/apt/apt-mirrors.txt
            sleep 15
          done
      - name: Build the test binary
        run: |
          cargo test -p socketguard-daemon --test netns --no-run --message-format=json > build.json
          jq -r 'select(.reason == "compiler-artifact" and .target.name == "netns" and .executable != null) | .executable' build.json | tail -n1 > netns-bin
          test -s netns-bin
      - name: Run as root
        working-directory: crates/daemon
        # Explicit bash gets -o pipefail, so a failing test fails the step despite tee.
        shell: bash
        run: sudo env SOCKETGUARD_NETNS_TESTS=1 "$(cat "$GITHUB_WORKSPACE/netns-bin")" --test-threads=1 --nocapture 2>&1 | tee "$RUNNER_TEMP/netns.log"
      - name: Check the tests did not skip
        run: "! grep -q 'skipping netns test' \"$RUNNER_TEMP/netns.log\""

  # The macOS code has no other CI; sudo gives root for the pf check and the smoke test.
  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
        with:
          components: clippy
      - run: cargo clippy --workspace --exclude socketguard-ui --all-targets -- -D warnings
      - run: cargo test --workspace --exclude socketguard-ui --no-fail-fast
      - name: pfctl accepts the rendered ruleset
        run: |
          cargo test -p socketguard-daemon --lib pf_accepts --no-run --message-format=json > build.json
          bin=$(jq -r 'select(.reason == "compiler-artifact" and .target.kind[0] == "lib" and .profile.test == true and .executable != null) | .executable' build.json | tail -n1)
          sudo env SOCKETGUARD_PF_CHECK=1 "$bin" pf_accepts --nocapture

  macos-smoke:
    runs-on: macos-latest
    needs: macos
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/setup
      - run: deploy/ci/macos-smoke.sh
