name: bundle third-party prerequisites
description: >-
  What `./build.sh --stage --require-signature` needs to fetch the pinned Tor and Yggdrasil (and
  wintun.dll on Windows) for the staged tree (ADR 0052, docs/packaging.md): the Go version of
  versions.toml, gpg, and the download cache. Run it before build.sh.

# Tor: checksum and Tor Project signature (gpg is required). Yggdrasil: built from the pinned commit
# (Go, at least the version in versions.toml). Downloads and the Yggdrasil source are cached under
# .bundle-cache, keyed on versions.toml (not under target/, which the Rust cache prunes).
runs:
  using: composite
  steps:
    - id: pins
      shell: bash
      run: |
        go=$(awk -F'"' '/^\[/ { s = ($0 == "[yggdrasil]") } s && /^go[ \t]*=/ { print $2; exit }' deploy/bundle/versions.toml)
        [ -n "$go" ] || { echo "no [yggdrasil] go in versions.toml" >&2; exit 1; }
        echo "go=$go" >> "$GITHUB_OUTPUT"

    - uses: actions/setup-go@v5
      with:
        go-version: ${{ steps.pins.outputs.go }}
        cache: false

    - uses: actions/cache@v4
      with:
        path: .bundle-cache
        key: bundle-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('deploy/bundle/versions.toml') }}

    # --require-signature needs gpg. Ubuntu and Git for Windows have it; the macOS image has it
    # as a rule. Whatever is missing is installed here, never skipped.
    - name: gpg
      shell: bash
      run: |
        if ! command -v gpg >/dev/null 2>&1; then
          case "$RUNNER_OS" in
            macOS) brew install gnupg ;;
            Linux) sudo apt-get update -qq && sudo apt-get install -y -qq gnupg ;;
            Windows)
              choco install gnupg -y --no-progress
              export PATH="$PATH:/c/Program Files (x86)/GnuPG/bin"
              echo 'C:\Program Files (x86)\GnuPG\bin' >> "$GITHUB_PATH"
              ;;
          esac
        fi
        gpg --version | head -1

    # build.sh runs fetch.sh, which keeps its downloads in this directory.
    - shell: bash
      run: echo "SOCKETGUARD_BUNDLE_CACHE=$PWD/.bundle-cache" >> "$GITHUB_ENV"
