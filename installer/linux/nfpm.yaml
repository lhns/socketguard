# One description for the deb and the rpm (nfpm). Rendered by installer/linux/build.sh, which
# sets VERSION, STAGE (the staged tree, docs/packaging.md) and POSTRM. The systemd unit is NOT shipped:
# `socketguard-daemon service install` writes it (from the same text the daemon embeds, with
# ExecStart naming /usr/bin/socketguard-daemon), so a package file could only drift from it.
name: socketguard
arch: amd64
platform: linux
version: ${VERSION}
release: "1"
section: net
priority: optional
maintainer: lhns <noreply@users.noreply.github.com>
description: |
  Per-application firewall and addresses.
  The daemon runs as a systemd service; socketguard is the command line, socketguard-ui the
  desktop app. Removing the package keeps the settings and keys; purging deletes them.
vendor: lhns
homepage: https://github.com/lhns/socketguard
license: Apache-2.0

depends:
  - nftables
  - iproute2
  - conntrack
  - libwebkit2gtk-4.1-0
  - libgtk-3-0
  # The bundled Tor links the system libz.so.1 (the Tor bundle does not carry it).
  - zlib1g

contents:
  - src: ${STAGE}/socketguard-daemon
    dst: /usr/bin/socketguard-daemon
    file_info:
      mode: 0755
  - src: ${STAGE}/socketguard
    dst: /usr/bin/socketguard
    file_info:
      mode: 0755
  - src: ${STAGE}/socketguard-ui
    dst: /usr/bin/socketguard-ui
    file_info:
      mode: 0755
  - src: installer/linux/socketguard.desktop
    dst: /usr/share/applications/socketguard.desktop
  - src: ui/src-tauri/icons/128x128.png
    dst: /usr/share/icons/hicolor/128x128/apps/socketguard.png
  - src: ${STAGE}/LICENSE
    dst: /usr/share/doc/socketguard/LICENSE
  - src: ${STAGE}/THIRD_PARTY_NOTICES.md
    dst: /usr/share/doc/socketguard/THIRD_PARTY_NOTICES.md
  # Tor runs as the unprivileged account socketguard-net (ADR 0052): the stage has fixed the modes
  # of the tree (everyone reads and runs, only root writes); nfpm keeps them.
  - src: ${STAGE}/third_party/
    dst: /usr/lib/socketguard/third_party/
    type: tree

overrides:
  deb:
    scripts:
      postinstall: installer/linux/scripts/deb-postinst
      preremove: installer/linux/scripts/deb-prerm
      postremove: ${POSTRM}
  rpm:
    depends:
      - nftables
      - iproute
      - conntrack-tools
      - webkit2gtk4.1
      - gtk3
      - zlib
    scripts:
      postinstall: installer/linux/scripts/rpm-post
      preremove: installer/linux/scripts/rpm-preun
