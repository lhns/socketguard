[package]
name = "socketguard-ui"
version.workspace = true
edition = "2021"
license = "Apache-2.0"

[dependencies]
socketguard-client = { path = "../../crates/client" }
socketguard-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "time"] }
futures-util = "0.3"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_System_Threading",
    "Win32_Foundation",
] }

# custom-protocol: embed frontend assets instead of proxying to devUrl.
# Enabled by default so `cargo build --release` works without extra flags.
# `tauri dev` overrides this with --no-default-features for hot reload.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
devtools = ["tauri/devtools"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
