[package]
name = "socketguard-ui"
version = "0.1.0"
edition = "2021"

[dependencies]
socketguard-core = { path = "../../crates/core" }
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
futures-util = "0.3"
anyhow = "1"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Foundation",
] }

# custom-protocol: embed frontend assets instead of proxying to devUrl.
# Enabled by default so `cargo build --release` works without extra flags.
# `tauri dev` overrides this with --no-default-features for hot reload.
[features]
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
